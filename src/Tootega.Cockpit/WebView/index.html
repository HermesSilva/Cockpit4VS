<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 img-src https://cockpit.invalid data: blob:;
                 media-src https://cockpit.invalid blob:;
                 script-src https://cockpit.invalid;
                 style-src https://cockpit.invalid 'unsafe-inline';
                 font-src https://cockpit.invalid;
                 connect-src https://cockpit.invalid;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tootega Cockpit</title>
  <!--
    Two style hooks, in this order:
      #vs-theme  - written by the host on load and on every theme change; it defines the
                   --vscode-* variables the bundle's CSS reads.
      main.css   - the bundle's own styles, which consume those variables.
    The order matters: the variables have to exist before the rules that use them.
  -->
  <style id="vs-theme"></style>
  <link rel="stylesheet" href="main.css" />
</head>
<!--
  spellcheck is off for the whole document, and inherited by every field in it.

  WebView2 leaves Chromium's own spell-checker on, which VS Code's webview host does not,
  and it checks against the display language alone: a prompt written in Portuguese comes
  back with almost every word underlined. The Cockpit brings its own checker — it marks a
  word only when BOTH dictionaries reject it, and never corrects on its own — so the
  browser's is not a second opinion, it is noise on top of the right answer.

  It is set here, on the host page, rather than on the React components: those are shared
  with the VS Code extension, and this is a difference between the two hosts.
-->
<body spellcheck="false">
  <div id="root"></div>
  <script src="main.js"></script>
</body>
</html>
